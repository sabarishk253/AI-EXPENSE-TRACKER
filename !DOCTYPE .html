<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #219150;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 AI Expense Tracker</h1>
    <p>Smart Expense Management System</p>
</header>

<div class="container">

    <!-- Add Expense -->
    <div class="card">
        <h2>Add Expense</h2>
        <input type="text" id="desc" placeholder="Expense Description">
        <input type="number" id="amount" placeholder="Amount (₹)">
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Expense Table -->
    <div class="card">
        <h2>Expense List</h2>
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount (₹)</th>
                    <th>Category (AI)</th>
                </tr>
            </thead>
            <tbody id="expenseTable"></tbody>
        </table>

        <div class="total">
            Total Expense: ₹ <span id="total">0</span>
        </div>
    </div>

</div>

<script>
    let total = 0;

    function predictCategory(desc) {
        desc = desc.toLowerCase();
        if (desc.includes("grocery") || desc.includes("vegetable"))
            return "Groceries";
        else if (desc.includes("uber") || desc.includes("bus"))
            return "Transport";
        else if (desc.includes("electricity") || desc.includes("bill"))
            return "Utilities";
        else if (desc.includes("restaurant") || desc.includes("food"))
            return "Dining";
        else
            return "Other";
    }

    function addExpense() {
        const desc = document.getElementById("desc").value;
        const amount = Number(document.getElementById("amount").value);

        if (desc === "" || amount <= 0) {
            alert("Please enter valid details");
            return;
        }

        const category = predictCategory(desc);
        const table = document.getElementById("expenseTable");
        const row = table.insertRow();

        row.insertCell(0).innerText = desc;
        row.insertCell(1).innerText = amount.toFixed(2);
        row.insertCell(2).innerText = category;

        total += amount;
        document.getElementById("total").innerText = total.toFixed(2);

        document.getElementById("desc").value = "";
        document.getElementById("amount").value = "";
    }
</script>

</body>
</html>
